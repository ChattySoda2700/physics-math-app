<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>電卓 - Math & Physics</title>

    <link rel="stylesheet" href="../css/calculator.css">
</head>

<body>

    <header>
        <a href="../index.html" class="back-button">← ホーム</a>
        <h1>電卓</h1>
    </header>

    <main class="calculator">

        <div class="display">
            <div id="expression"></div>
            <div id="result">0</div>
        </div>

        <div class="buttons">

            <button class="function" data-action="clear">AC</button>
            <button class="function" data-action="sign">±</button>
            <button class="function" data-action="percent">%</button>
            <button class="operator" data-operator="/">÷</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-operator="*">×</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-operator="-">−</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="operator" data-operator="+">＋</button>

            <button class="zero" data-number="0">0</button>
            <button data-number=".">.</button>
            <button class="equals" data-action="equals">=</button>

        </div>

        <section class="history">
            <h2>計算履歴</h2>
            <div id="history-list"></div>
        </section>

    </main>

    <div class="version">v1.0.0</div>

    <script src="../js/calculator.js"></script>

</body>
</html>
